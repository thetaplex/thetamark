name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: extractions/setup-just@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg xvfb
      - run: just setup
      - run: just check
      - if: runner.os == 'Linux'
        run: xvfb-run -a just e2e
      - if: runner.os != 'Linux'
        run: just e2e
      - run: just make
      - uses: actions/upload-artifact@v7
        with:
          name: thetamark-${{ matrix.os }}
          path: out/make/**
